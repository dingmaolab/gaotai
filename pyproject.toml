[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gaotai"
version = "0.3.0"
description = "稿台 — 自媒体内容生产系统（Agent Skill + Python CLI）"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
hot = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
gaotai = "gaotai:main"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.setuptools.package-data]
core = ["*.yaml"]